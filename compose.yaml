services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: risk_workbench
      POSTGRES_USER: risk_workbench
      POSTGRES_PASSWORD: risk_workbench_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U risk_workbench -d risk_workbench",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: